<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Data Science student and Computer Engineering student blending analytics, machine learning, software engineering and web development." />
    <meta name="theme-color" content="#f0ede6" />
    <title>Sofía Arbeláez Mejía | Data Science & Software Engineering</title>
    <script>
      try {
        const savedTheme = window.localStorage.getItem('portfolio-theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = savedTheme === 'dark' || (!savedTheme && prefersDark) ? 'dark' : 'light';
      } catch (error) {
        console.warn('Unable to read the saved appearance preference', error);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
